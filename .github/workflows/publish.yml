name: Publish to NPM

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Get current version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version exists on NPM
        id: check-version
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          echo "Checking if version $VERSION exists on NPM..."
          
          # Tenta verificar se a versão já existe no NPM (sem autenticação necessária)
          NPM_OUTPUT=$(npm view plutin@$VERSION version 2>&1) || true
          
          if echo "$NPM_OUTPUT" | grep -q "^$VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION already exists on NPM - skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Version $VERSION is new - will be published"
          fi
        continue-on-error: true

      - name: Run tests
        if: steps.check-version.outputs.exists != 'true'
        run: npm run test

      - name: Build project
        if: steps.check-version.outputs.exists != 'true'
        run: npm run build

      - name: Publish to NPM
        if: steps.check-version.outputs.exists != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag if published
        if: steps.check-version.outputs.exists != 'true' && github.ref_type != 'tag'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin "v$VERSION"